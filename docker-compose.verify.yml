# Despliegue desechable para verificar desde cero sin tocar el volumen habitual.
# La BD reside en memoria (tmpfs), pero el motor es PostgreSQL real.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: miniaula_verificacion_test
      POSTGRES_USER: miniaula
      POSTGRES_PASSWORD: verificacion_local_2026
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 20
  api:
    build: ./api
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: miniaula_verificacion_test
      DB_USER: miniaula
      DB_PASSWORD: verificacion_local_2026
      FRONTEND_ORIGIN: http://127.0.0.1
      SEED_ON_START: "true"
      SEED_PASSWORD: DemoAula2026!
      BEHIND_PROXY: "true"
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ./web
      args:
        VITE_API_URL: /api
    ports:
      - "127.0.0.1::80"
    depends_on:
      api:
        condition: service_healthy
